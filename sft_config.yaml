# SFT profile for RTX 4090 24GB: Qwen3-4B + bf16 LoRA.
model_name_or_path: D:/model_cache/modelscope/hub/models/Qwen/Qwen3-4B
stage: sft
do_train: true
finetuning_type: lora

dataset: underwater_acoustics
dataset_dir: ./data
template: qwen
cutoff_len: 1024
max_samples: 5000
preprocessing_num_workers: 4

# Quality-oriented LoRA. Do not use 4-bit quantization for this 4090 profile.
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

output_dir: ./output/qwen3_4b_sft
overwrite_output_dir: true
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: false
optim: adamw_torch

# Keep validation metrics; train_loss alone is not enough for hallucination work.
val_size: 0.1
eval_strategy: steps
eval_steps: 100
save_steps: 500
logging_steps: 10
plot_loss: true

